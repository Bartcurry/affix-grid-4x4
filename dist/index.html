<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#090B10" />
    <meta name="description" content="在 4×4 法阵中摆放、合成并连锁触发符文，挑战 20 波守门核心。「玄墨鎏金」新中式战术法阵。" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="词条法阵" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23090B10' d='M0 0h32v32H0z'/%3E%3Cpath fill='none' stroke='%23D4AF37' stroke-width='1.5' d='M3 3h26v26H3zM16 7l9 9-9 9-9-9zm0 4v10m-5-5h10'/%3E%3C/svg%3E" />
    <title>4×4 词条法阵 · 玄墨鎏金</title>
    <script type="module" crossorigin src="./assets/index-D_XUnqrS.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-0agfXCuA.css">
  </head>
  <body>
    <main class="game" id="game" aria-label="4×4 词条法阵">
      <!-- 顶部精简两行高质感战况栏 -->
      <header class="hud-top">
        <!-- 战况栏第一行：Boss 徽记、波次、双层残影血条、资源状态与功能键 -->
        <div class="hud-row-status">
          <div class="boss-identity">
            <div class="boss-emblem-wrap" id="boss-emblem-wrap" title="敌人专属图腾徽记">
              <svg class="boss-emblem-svg" id="boss-emblem-svg" viewBox="0 0 32 32" aria-hidden="true">
                <path id="boss-emblem-path" d="" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <div class="boss-meta">
              <div class="boss-title-row">
                <span id="wave" class="wave-pill">第 1 / 20 波</span>
                <h2 id="enemy-name" class="boss-name">守门核心</h2>
                <div id="boss-armor-shields" class="boss-armor-shields" hidden title="铁壳减伤护盾">
                  <span class="boss-shield-icon" id="boss-shield-1"><svg viewBox="0 0 32 32"><path d="M16 3L27 7V15C27 22 22 27 16 29C10 27 5 22 5 15V7Z" fill="currentColor"/></svg></span>
                  <span class="boss-shield-icon" id="boss-shield-2"><svg viewBox="0 0 32 32"><path d="M16 3L27 7V15C27 22 22 27 16 29C10 27 5 22 5 15V7Z" fill="currentColor"/></svg></span>
                </div>
              </div>
              <div class="hp-gauge-row">
                <div class="hp-track" id="hp-meter" role="progressbar" aria-label="敌人生命" aria-valuemin="0">
                  <span id="hp-ghost" class="hp-ghost"></span>
                  <span id="hp-fill" class="hp-fill"></span>
                </div>
                <div class="hp-numbers">
                  <span id="hp-poison-badge" class="hp-poison-badge" hidden title="敌人身上附带的剧毒层数">
                    <svg viewBox="0 0 32 32" class="poison-mini-icon"><path d="M16 4C12 10 7 15 7 20A9 9 0 0 0 25 20C25 15 20 10 16 4Z" fill="currentColor"/></svg>
                    <span id="hp-poison-text">0</span>
                  </span>
                  <span id="hp-text" class="hp-text"></span>
                </div>
              </div>
            </div>
          </div>

          <div class="player-resources">
            <div class="res-item res-shield" title="护盾">
              <svg viewBox="0 0 32 32" class="res-icon" aria-hidden="true"><path d="M16 3L27 7V15C27 22 22 27 16 29C10 27 5 22 5 15V7Z" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
              <strong id="shield" class="shield">3/3</strong>
            </div>
            <div class="res-item res-poison" title="剧毒">
              <svg viewBox="0 0 32 32" class="res-icon" aria-hidden="true"><path d="M16 4C12 10 7 15 7 20A9 9 0 0 0 25 20C25 15 20 10 16 4Z" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
              <strong id="poison" class="poison">0</strong>
            </div>
            <div class="res-item res-gold" title="金币">
              <svg viewBox="0 0 32 32" class="res-icon" aria-hidden="true"><path d="M16 3A13 13 0 1 0 16 29A13 13 0 1 0 16 3M12 12H20V20H12Z" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
              <strong id="gold" class="gold">10</strong>
            </div>
          </div>

          <div class="hud-utility">
            <button id="openings" type="button" title="换开局">开局</button>
            <button id="codex" type="button" title="天机阁 · 图鉴与战绩">天机阁</button>
            <button id="ambient" type="button" aria-pressed="true" title="五音雅乐背景禅音">雅乐</button>
            <button id="sound" type="button" aria-pressed="false" title="音效">音效</button>
            <button id="help" type="button" aria-label="玩法说明" title="玩法">玩法</button>
          </div>
        </div>

        <!-- 战况栏第二行：紧凑芯片条（前方敌情预告 + 20波进度刻度 + 已获遗物紧凑列表） -->
        <div class="hud-row-chips">
          <div class="boss-intel" id="boss-intel">
            <span class="chip-badge">敌情</span>
            <span id="boss-intel-text" class="boss-intel-text">加载中...</span>
          </div>
          <div class="wave-track" id="wave-track" aria-hidden="true"></div>
          <div id="relic-list" class="relic-chip-list"></div>
        </div>

        <!-- 战况栏第三行：流派共鸣羁绊徽条（连锁/剧毒/金币/增幅 3/5 件套状态） -->
        <div class="hud-row-synergies" id="hud-synergies" aria-label="法阵共鸣羁绊"></div>
        <p id="enemy-hint" class="enemy-hint" hidden></p>
      </header>

      <!-- 核心黄金区域：4×4 动态法阵棋盘与悬浮词条详情卡片 -->
      <section class="arena-wrap panel" aria-label="布阵区域">
        <div class="arena-bar">
          <span id="board-count" class="board-counter">已布阵 0/16</span>
          <span id="arena-hint" class="arena-hint-text">点符文看作用，拖动或轻击换位</span>
          <span id="phase" class="phase-pill">布阵</span>
          <button id="inspect-jump" type="button" hidden>看词条</button>
        </div>

        <canvas id="arena" tabindex="0" aria-label="4×4 词条法阵棋盘与备战区。方向键选择格子，回车选中或放置，Delete 回收，Escape 取消。">此浏览器不支持 Canvas。</canvas>

        <!-- 悬浮半透明磨砂暗金词条详情卡片（避免撑坏界面） -->
        <section class="inspector floating-card" id="inspector" tabindex="-1" aria-label="词条详情" data-visible="false">
          <div class="inspector-header">
            <div id="rune-icon" class="inspect-icon-wrap" aria-hidden="true"></div>
            <div class="inspect-title-block">
              <div class="inspect-tags">
                <span id="rune-context" class="rune-context"></span>
                <div id="rune-stats" class="rune-stats"></div>
              </div>
              <h2 id="rune-name" class="inspect-rune-name"></h2>
            </div>
            <button id="sell-selected" type="button" class="sell-btn" hidden></button>
            <button id="inspect-close" type="button" class="inspect-close-btn" aria-label="关闭词条说明">✕</button>
          </div>
          <p id="rune-desc" class="inspect-rune-desc"></p>
          <p class="target-legend" id="target-legend" hidden></p>
        </section>
      </section>

      <!-- 底部一体化操作台：推演条 + 符文铺实体小牌 + 主控按钮 -->
      <div class="deck-station">
        <!-- 紧凑单行战况推演条 -->
        <section class="forecast-strip panel" id="forecast" aria-label="战斗推演">
          <div class="forecast-main">
            <span id="forecast-verdict" class="forecast-verdict-pill"></span>
            <div class="forecast-gauge" aria-hidden="true"><span id="forecast-fill"></span></div>
            <span id="forecast-readout" class="forecast-readout-text"></span>
          </div>
          <div class="forecast-actions">
            <label class="forecast-toggle" title="切换模糊战果与精确数值"><input type="checkbox" id="exact-toggle"><span>精确</span></label>
            <button id="forecast-detail" type="button" class="btn-subtle">明细</button>
          </div>
        </section>

        <!-- 符文铺（3张实体小牌横排展示） -->
        <section class="market panel" id="market" tabindex="-1" aria-label="符文商店">
          <div class="market-bar">
            <div class="shop-title-group">
              <span class="market-title">符文铺</span>
              <span id="bench-count" class="bench-counter">备战区 0/4</span>
            </div>
            <div class="shop-order">
              <label for="shop-focus">优先</label>
              <select id="shop-focus">
                <option value="any">不限</option>
                <option value="chain">连锁</option>
                <option value="poison">剧毒</option>
                <option value="gold">金币</option>
                <option value="amplify">增幅</option>
              </select>
            </div>
            <div class="market-actions">
              <button type="button" id="refresh" class="btn-refresh">刷新 · 2 金</button>
              <button type="button" id="reward" class="btn-reward" title="看广告换两次刷新">看广告+2</button>
            </div>
          </div>
          <div class="offers" id="offers"></div>
          <div class="market-foot-hidden">
            <button type="button" id="board-jump" hidden>回棋盘</button>
          </div>
        </section>

        <!-- 主控操作栏：撤销、启动法阵、倍速、跳过 -->
        <footer class="deck-controls">
          <button type="button" id="undo" class="ctrl-btn" aria-label="撤销上一步 (Ctrl+Z)" disabled>撤销</button>
          <button type="button" id="battle" class="primary battle-btn">启动法阵</button>
          <button type="button" id="speed" class="ctrl-btn" aria-label="切换播放速度">1×</button>
          <button type="button" id="skip" class="ctrl-btn" hidden disabled>跳过</button>
          <button type="button" id="market-jump" hidden>商店</button>
        </footer>
      </div>

      <!-- 紧凑战绩与辅助功能条 -->
      <section class="report panel" id="report" aria-label="战斗记录">
        <div class="report-lead">
          <span id="run-opening" class="run-opening"></span>
          <small id="run-seed" class="run-seed"></small>
        </div>
        <dl class="report-stats">
          <div><dt>上轮伤害</dt><dd id="last-damage">—</dd></div>
          <div><dt>最高连击</dt><dd id="best-combo">—</dd></div>
        </dl>
        <button id="support" type="button" title="请作者喝可乐（自愿支持）">支持</button>
      </section>

      <!-- 浮动通知 Toast -->
      <p id="notice" class="notice" role="status" aria-live="polite"></p>

      <!-- 弹窗：结果结算面板 -->
      <dialog id="panel">
        <div class="dialog-content">
          <div id="panel-stamp-wrap" class="panel-stamp-wrap" hidden>
            <div class="vermilion-stamp" id="vermilion-stamp">破阵！</div>
          </div>
          <h2 id="panel-title"></h2>
          <div id="panel-mvp-card" class="panel-mvp-card" hidden></div>
          <p id="panel-text"></p>
          <div id="panel-actions" class="dialog-actions"></div>
        </div>
      </dialog>

      <!-- 弹窗：战斗推演明细 -->
      <dialog id="forecast-dialog" aria-labelledby="forecast-title">
        <div class="dialog-content">
          <h2 id="forecast-title">战斗明细</h2>
          <p id="forecast-summary"></p>
          <p id="forecast-gold" class="forecast-gold"></p>
          <ol id="forecast-sources" class="forecast-sources"></ol>
          <div class="dialog-actions">
            <button id="forecast-close" class="primary" type="button">返回布阵</button>
          </div>
        </div>
      </dialog>

      <!-- 弹窗：遗物选择 -->
      <dialog id="relic-dialog" class="celestial-dialog" aria-labelledby="relic-title">
        <div class="dialog-content">
          <div class="celestial-header">
            <span class="celestial-pill">仙家灵宝 · 翻牌参悟</span>
            <p id="relic-wave" class="dialog-subtitle"></p>
            <h2 id="relic-title">神机天工秘宝</h2>
            <p class="dialog-desc">心神合一，翻开灵符揭晓秘宝。每件秘宝都将激发流派质变，贯穿本局始终。</p>
          </div>
          <div class="relic-choices celestial-choices" id="relic-choices"></div>
        </div>
      </dialog>

      <!-- 弹窗：已获遗物行囊 -->
      <dialog id="relic-bag" aria-labelledby="relic-bag-title">
        <div class="dialog-content">
          <h2 id="relic-bag-title">已持遗物行囊</h2>
          <ul id="relic-inventory" class="relic-inventory"></ul>
          <div class="dialog-actions">
            <button id="relic-bag-close" class="primary" type="button">返回布阵</button>
          </div>
        </div>
      </dialog>

      <!-- 弹窗：挑选开局法阵 -->
      <dialog id="opening-dialog" class="opening-dialog-grand" aria-labelledby="opening-title">
        <div class="dialog-content">
          <div class="opening-hero-banner">
            <div class="grand-seal">玄墨鎏金</div>
            <h2 id="opening-title" class="opening-grand-title">四象入局 · 择道启阵</h2>
            <p id="opening-note" class="opening-grand-subtitle"></p>
          </div>
          <div class="seed-input-row">
            <label for="opening-seed">天机玄码：</label>
            <input type="text" id="opening-seed" placeholder="可选，如 A7K9-M2P4" maxlength="12" spellcheck="false" autocomplete="off" />
            <button type="button" id="random-seed">摇卦</button>
          </div>
          <div id="opening-choices" class="opening-choices-grid"></div>
          <div id="opening-confirm" class="opening-confirm" hidden>
            <p id="opening-warning" role="status"></p>
            <div class="dialog-actions">
              <button id="opening-start" class="primary" type="button">立下誓约 · 启阵</button>
              <button id="opening-back" type="button">再择良机</button>
            </div>
          </div>
          <button id="opening-close" type="button" class="btn-subtle-close">守静笃行 · 回阵</button>
        </div>
      </dialog>

      <!-- 弹窗：天机阁 · 图鉴系统与历劫战史 -->
      <dialog id="codex-dialog" class="codex-dialog-grand" aria-labelledby="codex-title">
        <div class="dialog-content codex-dialog-content">
          <header class="codex-header">
            <div class="codex-title-wrap">
              <span class="celestial-pill">天机阁 · 仙藏全卷</span>
              <h2 id="codex-title" class="codex-title">符文图鉴与历劫战史</h2>
            </div>
            <button id="codex-close" type="button" class="btn-subtle-close" aria-label="关闭天机阁">✕</button>
          </header>

          <nav class="codex-nav-tabs" role="tablist">
            <button type="button" id="tab-btn-runes" class="codex-tab-btn active" role="tab" aria-selected="true" aria-controls="codex-panel-runes">符文宝典 (26)</button>
            <button type="button" id="tab-btn-relics" class="codex-tab-btn" role="tab" aria-selected="false" aria-controls="codex-panel-relics">仙家灵宝 (15)</button>
            <button type="button" id="tab-btn-archives" class="codex-tab-btn" role="tab" aria-selected="false" aria-controls="codex-panel-archives">历劫战史</button>
          </nav>

          <!-- Tab 1 内容：符文宝典 -->
          <section id="codex-panel-runes" class="codex-panel active" role="tabpanel">
            <div class="codex-filter-bar">
              <button type="button" class="codex-filter-btn active" data-filter="all">全部 (26)</button>
              <button type="button" class="codex-filter-btn" data-filter="chain">⚡ 连锁 (7)</button>
              <button type="button" class="codex-filter-btn" data-filter="poison">💧 剧毒 (6)</button>
              <button type="button" class="codex-filter-btn" data-filter="gold">◆ 金币 (7)</button>
              <button type="button" class="codex-filter-btn" data-filter="amplify">✦ 增幅 (6)</button>
            </div>
            <div id="codex-runes-grid" class="codex-runes-grid"></div>
          </section>

          <!-- Tab 2 内容：仙家灵宝 -->
          <section id="codex-panel-relics" class="codex-panel" role="tabpanel" hidden>
            <div id="codex-relics-grid" class="codex-relics-grid"></div>
          </section>

          <!-- Tab 3 内容：历劫战史 -->
          <section id="codex-panel-archives" class="codex-panel" role="tabpanel" hidden>
            <div id="codex-archives-list" class="codex-archives-list"></div>
          </section>
        </div>
      </dialog>

      <!-- 弹窗：模拟激励广告 -->
      <dialog id="ad">
        <div class="dialog-content">
          <h2>神识参悟</h2>
          <p id="ad-text" role="status"></p>
          <div class="dialog-actions">
            <button id="cancel-ad" type="button">取消</button>
          </div>
        </div>
      </dialog>
    </main>
  </body>
</html>
