<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191b16" />
    <meta name="description" content="在 4×4 法阵中摆放、合成并连锁触发符文，挑战 20 波守门核心。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23191b16' d='M0 0h32v32H0z'/%3E%3Cpath fill='none' stroke='%23e3b578' stroke-width='1.5' d='M3 3h26v26H3zM16 7l9 9-9 9-9-9zm0 4v10m-5-5h10'/%3E%3C/svg%3E" />
    <title>4×4 词条法阵</title>
  </head>
  <body>
    <main class="game" id="game" aria-label="4×4 词条法阵">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M5 5h38v38H5zM10 10h28v28H10zM24 13l11 11-11 11-11-11zM24 17v14m-7-7h14"/><path d="M5 5l5 5m28 28 5 5m0-38-5 5M10 38l-5 5"/><circle cx="24" cy="24" r="3" class="sigil-center"/></svg></div>
          <div class="brand-copy"><h1>词条法阵</h1><span class="edition">4 × 4</span></div>
        </div>
        <div class="utility"><button id="openings" type="button">换开局</button><button id="sound" type="button" aria-pressed="false"></button><button id="help" type="button" aria-label="玩法说明">玩法</button></div>
      </header>
      <section class="boss panel" aria-label="战斗状态">
        <div class="boss-plate">
          <svg class="gate-mask" viewBox="0 0 220 166" aria-hidden="true">
            <defs>
              <pattern id="engraving" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(34)"><path d="M0 0v5" stroke="#2a2117" stroke-width="1.5"/></pattern>
              <g id="mask-half">
                <path d="M107 42 84 36 72 53 52 47 35 25 32 49 46 71 28 75 38 90 62 94 53 108 77 112 82 135 98 146 110 130 111 67Z" fill="#67472d" stroke="#cf9b5d" stroke-width="1.5"/>
                <path d="M107 48 87 42 72 61 52 54 40 44 47 61 65 75 45 74 49 82 71 88 64 104 85 101 90 121 103 118 110 93Z" fill="url(#engraving)" stroke="#a4764d"/>
                <path d="m101 59-14-5-12 11-11-2 14 14 18 1 9-8Z" fill="#2b2219" stroke="#d2a26a"/>
                <path d="m78 68 18-2-5 6-9 1Z" fill="#f0c281"/>
                <path d="m106 80-13 7-19-4 8 13 12 1 4 10 8-7M102 118l-8 8 6 8 8-10M65 39l7-15 15-5 10 12M48 98l-4 15 13 9 15-2m-12 8 6 11 16 1" fill="none" stroke="#ad8152" stroke-width="1.5"/>
                <path d="m35 31 11 28 11 8m-12 11 16 2m-5 6 14 2m8 23 6 15m4-90 7 4m-48 6 11 7m-8 56 8 5" fill="none" stroke="#e1ac6b" opacity=".6"/>
              </g>
            </defs>
            <path d="M110 4 200 54v54l-90 51L20 108V54Z M110 11l83 47v46l-83 47-83-47V58Z" fill="none" stroke="#b78656" opacity=".38"/>
            <circle cx="110" cy="81" r="68" fill="none" stroke="#b78656" stroke-dasharray="2 4" opacity=".57"/>
            <use href="#mask-half"/><use href="#mask-half" transform="translate(220) scale(-1 1)"/>
            <path d="m110 30 10 14-10 18-10-18Z M110 79l7 12-7 10-7-10Z" fill="#a84737" stroke="#de9865"/>
            <path d="M108 47h4m-2-4v8m-6 61 6 5 6-5m-7 18 1 5 1-5" fill="none" stroke="#f3c987"/>
          </svg>
          <div class="boss-head">
            <div class="boss-title"><p id="wave" class="wave">第 1 / 20 波</p><h2 id="enemy-name">守门核心</h2></div>
            <div class="hp-readout"><span>生命</span><strong id="hp-text"></strong></div>
            <div class="hp-track" id="hp-meter" role="progressbar" aria-label="敌人生命" aria-valuemin="0"><span id="hp-fill"></span></div>
            <div class="wave-track" id="wave-track" aria-hidden="true"></div>
          </div>
        </div>
        <p id="enemy-hint" class="enemy-hint" hidden></p>
        <div class="resources"><div><span>护盾</span><strong id="shield" class="shield"></strong></div><div><span>剧毒</span><strong id="poison" class="poison"></strong></div><div><span>金币</span><strong id="gold" class="gold"></strong></div></div>
      </section>
      <div class="battle-layout">
        <section class="arena panel" aria-label="布阵区域">
          <div class="section-head"><h2>棋盘</h2><span id="phase" class="phase">布阵</span></div>
          <canvas id="arena" tabindex="0" aria-label="棋盘与备战区。方向键选择格子，回车选中或放置，Delete 出售，Escape 取消。">此浏览器不支持 Canvas。</canvas>
          <div class="arena-foot"><span id="board-count"></span><span id="arena-hint">点符文看作用，拖动换位</span><button id="inspect-jump" type="button" hidden>看词条</button></div>
        </section>
        <footer class="controls">
          <button type="button" id="speed" aria-label="切换播放速度">1×</button><button type="button" id="battle" class="primary">启动法阵</button><button type="button" id="market-jump">商店</button><button type="button" id="skip" hidden disabled>跳过</button>
        </footer>
      </div>
      <section class="forecast panel" id="forecast" aria-label="战斗推演">
        <div class="forecast-head"><h2>开战前</h2><span id="forecast-verdict" class="forecast-verdict"></span></div>
        <div class="forecast-gauge" aria-hidden="true"><span id="forecast-fill"></span></div>
        <p id="forecast-readout" class="forecast-readout"></p>
        <button id="forecast-detail" type="button">战斗明细</button>
      </section>
      <section class="inspector panel" id="inspector" tabindex="-1" aria-label="词条详情">
        <div id="rune-icon" aria-hidden="true"></div><div class="inspect-copy"><p id="rune-context" class="rune-context"></p><h2 id="rune-name"></h2><p id="rune-desc"></p><div id="rune-stats" class="rune-stats"></div><p class="target-legend" id="target-legend" hidden></p></div>
        <button id="sell-selected" type="button" hidden></button>
      </section>
      <section class="market panel" id="market" tabindex="-1" aria-label="符文商店">
        <div class="section-head"><h2>符文铺</h2><button type="button" id="refresh"></button></div>
        <div class="shop-order"><label for="shop-focus">刷新时优先找</label><select id="shop-focus"><option value="any">不限</option><option value="chain">连锁</option><option value="poison">剧毒</option><option value="gold">金币</option><option value="amplify">增幅</option></select></div>
        <div class="offers" id="offers"></div>
        <div class="market-foot"><span id="bench-count"></span><button type="button" id="reward">看广告换两次刷新</button><button type="button" id="board-jump">回棋盘</button></div>
      </section>
      <section class="report panel" aria-label="战斗记录">
        <div><h2>本局</h2><p id="run-opening" class="run-opening"></p></div><dl><div><dt>上轮伤害</dt><dd id="last-damage">—</dd></div><div><dt>最高连击</dt><dd id="best-combo">—</dd></div></dl>
        <div id="relic-list" class="relic-list" hidden></div>
      </section>
      <button id="support" type="button" title="请作者喝可乐（自愿支持）">请作者喝可乐</button>
      <p id="notice" class="notice" role="status" aria-live="polite"></p>
      <dialog id="panel"><div class="dialog-content"><h2 id="panel-title"></h2><p id="panel-text"></p><div id="panel-actions" class="dialog-actions"></div></div></dialog>
      <dialog id="forecast-dialog" aria-labelledby="forecast-title"><div class="dialog-content"><h2 id="forecast-title">战斗明细</h2><p id="forecast-summary"></p><p id="forecast-gold" class="forecast-gold"></p><ol id="forecast-sources" class="forecast-sources"></ol><div class="dialog-actions"><button id="forecast-close" class="primary" type="button">返回布阵</button></div></div></dialog>
      <dialog id="relic-dialog" aria-labelledby="relic-title"><div class="dialog-content"><p id="relic-wave"></p><h2 id="relic-title">挑一件遗物</h2><p>只能拿走一件，效果会留到这局结束。</p><div class="relic-choices" id="relic-choices"></div></div></dialog>
      <dialog id="relic-bag" aria-labelledby="relic-bag-title"><div class="dialog-content"><h2 id="relic-bag-title">这局拿到的遗物</h2><ul id="relic-inventory" class="relic-inventory"></ul><div class="dialog-actions"><button id="relic-bag-close" class="primary" type="button">回去布阵</button></div></div></dialog>
      <dialog id="opening-dialog" aria-labelledby="opening-title"><div class="dialog-content">
        <h2 id="opening-title">选个开局</h2><p id="opening-note"></p>
        <div id="opening-choices" class="opening-choices"></div>
        <div id="opening-confirm" class="opening-confirm" hidden>
          <p id="opening-warning" role="status"></p>
          <div class="dialog-actions"><button id="opening-start" class="primary" type="button">开始新局</button><button id="opening-back" type="button">再挑挑</button></div>
        </div>
        <button id="opening-close" type="button">回到当前局</button>
      </div></dialog>
      <dialog id="ad"><div class="dialog-content"><h2>模拟广告</h2><p id="ad-text" role="status"></p><div class="dialog-actions"><button id="cancel-ad" type="button">取消</button></div></div></dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
